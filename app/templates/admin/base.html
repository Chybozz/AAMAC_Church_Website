<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AAMAC Admin{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body class="admin-body">
  <div class="admin-glow admin-glow-one"></div><div class="admin-glow admin-glow-two"></div>
  <aside class="admin-sidebar">
    <a href="/admin" class="admin-brand"><span class="brand-emblem"><i class="bi bi-cross"></i></span><span><strong>AAMAC</strong><small>Content Studio</small></span></a>
    <div class="admin-nav-label">WORKSPACE</div>
    <nav class="admin-nav">
      <a href="/admin"><i class="bi bi-grid-1x2"></i><span>Overview</span></a>
      <a href="/admin/notices"><i class="bi bi-megaphone"></i><span>Notices</span></a>
      <a href="/admin/services"><i class="bi bi-calendar-heart"></i><span>Worship</span></a>
      <a href="/admin/theme"><i class="bi bi-stars"></i><span>Annual Theme</span></a>
      <a href="/admin/leaders"><i class="bi bi-person-hearts"></i><span>Leadership</span></a>
      <a href="/admin/family-groups"><i class="bi bi-people"></i><span>Family Groups</span></a>
    </nav>
    <div class="admin-nav-label">PUBLIC SITE</div>
    <nav class="admin-nav"><a href="/" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right"></i><span>View Website</span></a></nav>
    <form method="post" action="/admin/logout" class="admin-logout-wrap"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="admin-logout" type="submit"><i class="bi bi-box-arrow-left"></i><span>Sign out</span></button></form>
  </aside>
  <main class="admin-main">
    <div class="admin-mobile-head"><strong>AAMAC</strong><span>Content Studio</span><a href="/" target="_blank"><i class="bi bi-arrow-up-right"></i></a></div>
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', path='js/app.js') }}"></script>
</body>
</html>
