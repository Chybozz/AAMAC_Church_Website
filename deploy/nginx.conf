# Place this server block inside an Nginx sites-available configuration.
server {
    # Replace this with the real church domain.
    server_name aamac.example.com www.aamac.example.com;

    # Proxy all public requests to the local Gunicorn service.
    location / {
        # Forward traffic to the FastAPI/Gunicorn listener.
        proxy_pass http://127.0.0.1:8000;
        # Preserve the original host header.
        proxy_set_header Host $host;
        # Forward the original client IP.
        proxy_set_header X-Real-IP $remote_addr;
        # Forward the complete proxy chain.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tell the application whether the original connection used HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static files directly through Nginx for better efficiency.
    location /static/ {
        # Point this directory to the deployed AAMAC static directory.
        alias /var/www/aamac/app/static/;
        # Allow browsers to cache static assets for one day.
        expires 1d;
        # Add a cache-control header for static resources.
        add_header Cache-Control "public";
    }
}
